<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MOCK UP VIRTUAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

      color: #eef1e8;

      background:
        radial-gradient(
          circle at center,
          #30382a 0%,
          #1d231b 48%,
          #0d100c 100%
        );
    }

    .splash {
      width: calc(100% - 34px);
      height: calc(100% - 34px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(198, 211, 174, 0.25);
      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.035),
          rgba(0, 0, 0, 0.09)
        );

      box-shadow:
        inset 0 0 35px rgba(0, 0, 0, 0.55),
        0 15px 45px rgba(0, 0, 0, 0.5);
    }

    .line {
      width: 72px;
      height: 3px;
      margin-bottom: 24px;

      border-radius: 999px;
      background: #89976e;

      box-shadow:
        0 0 12px rgba(137, 151, 110, 0.35);
    }

    h1 {
      margin: 0;

      font-size: 39px;
      font-weight: 700;
      letter-spacing: 4px;

      color: #f2f4ed;
    }

    .subtitle {
      margin-top: 10px;

      font-size: 17px;
      font-weight: 500;
      letter-spacing: 2px;

      color: #b8c2a8;
    }

    .vehicle {
      margin-top: 6px;

      font-size: 14px;
      letter-spacing: 3px;

      color: rgba(232, 237, 224, 0.66);
    }

    .credits {
      margin-top: 54px;

      font-size: 12px;
      line-height: 1.7;
      letter-spacing: 0.6px;
      text-align: center;

      color: rgba(232, 237, 224, 0.52);
    }

    .loading {
      width: 210px;
      height: 3px;
      margin-top: 28px;

      overflow: hidden;

      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
    }

    .loading::after {
      content: "";

      display: block;
      width: 45%;
      height: 100%;

      border-radius: inherit;
      background: #a6b487;

      animation: loading 1.35s ease-in-out infinite;
    }

    @keyframes loading {
      0% {
        transform: translateX(-115%);
      }

      100% {
        transform: translateX(270%);
      }
    }
  </style>
</head>

<body>
  <main class="splash">
    <div class="line"></div>

    <h1>MOCK UP VIRTUAL</h1>

    <div class="subtitle">
      SIMULADOR DEL PANEL DE CONDUCCIÓN
    </div>

    <div class="vehicle">
      CENTRO DE ENTRENAMIENTO
    </div>

    <div class="credits">
      Desarrollado por<br>
      TTE. Francisco Yáñez Unzueta ·
      TTE. Juan Poblete Melgarejo
    </div>

    <div class="loading"></div>
  </main>
</body>
</html>
